server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Gọi API → chuyển tiếp sang container backend (cùng origin → cookie hoạt động)
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # File JS/CSS đã build có mã băm trong tên → cho trình duyệt cache lâu
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Route của React Router (/todos, /login...) không phải file thật → luôn trả index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
