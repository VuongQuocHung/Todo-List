services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Thiếu MYSQL_ROOT_PASSWORD trong .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-todo_app}
      # Tài khoản riêng cho app, chỉ có quyền trên database todo_app (không dùng root)
      MYSQL_USER: ${MYSQL_USER:?Thiếu MYSQL_USER trong .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Thiếu MYSQL_PASSWORD trong .env}
    volumes:
      # Dữ liệu lưu ra volume → xóa/tạo lại container vẫn còn
      - mysql_data:/var/lib/mysql
      # Lần đầu khởi tạo (volume trống), MySQL tự chạy các file .sql trong thư mục này
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Kết nối qua TCP 127.0.0.1: lúc MySQL đang chạy migration ban đầu thì TCP chưa mở → chưa healthy
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      # Chưa có HTTPS → tắt cờ Secure để đăng nhập được khi mở bằng IP LAN.
      # Khi chạy sau HTTPS thì đặt COOKIE_SECURE=true trong .env
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DB_HOST: mysql # tên service, không phải localhost
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-todo_app}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET trong .env}
      REDIS_URL: redis://redis:6379 # tên service
      CACHE_TTL_SECONDS: 60
    depends_on:
      # Chỉ khởi động backend khi MySQL và Redis đã SẴN SÀNG, không chỉ là "đã bật"
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
